name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Ekstrak file ZIP proyek (pilih yang nomornya paling besar)
        run: |
          best=""
          bestn=-1
          for f in *.zip; do
            [ -f "$f" ] || continue
            n="$(echo "$f" | grep -o '[0-9]\+' | tail -1)"
            [ -z "$n" ] && n=0
            if [ "$n" -gt "$bestn" ]; then
              bestn="$n"
              best="$f"
            fi
          done
          if [ -n "$best" ]; then
            echo "Memakai ZIP: $best"
            unzip -o "$best"
          else
            echo "Tidak ada ZIP, memakai file yang sudah ada di repositori"
          fi
          ls -la
          test -f settings.gradle.kts

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan Android SDK bawaan runner
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Unduh font dari Google Fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          BASE="https://raw.githubusercontent.com/google/fonts/main"
          get() {
            local path="$1"
            local name
            name="$(basename "$path")"
            local enc="${path//\[/%5B}"
            enc="${enc//\]/%5D}"
            if curl -fsSL --retry 3 --retry-delay 2 -o "app/src/main/assets/fonts/$name" "$BASE/$enc"; then
              echo "OK    $name"
            else
              rm -f "app/src/main/assets/fonts/$name"
              echo "GAGAL $path (dilewati)"
            fi
          }
          get "ofl/amiri/Amiri-Regular.ttf"
          get "ofl/amiri/Amiri-Bold.ttf"
          get "ofl/scheherazadenew/ScheherazadeNew-Regular.ttf"
          get "ofl/scheherazadenew/ScheherazadeNew-Medium.ttf"
          get "ofl/scheherazadenew/ScheherazadeNew-Bold.ttf"
          get "ofl/lateef/Lateef-Regular.ttf"
          get "ofl/notonaskharabic/NotoNaskhArabic[wght].ttf"
          get "ofl/cairo/Cairo[slnt,wght].ttf"
          get "ofl/cairo/Cairo[wght].ttf"
          get "ofl/tajawal/Tajawal-Regular.ttf"
          get "ofl/tajawal/Tajawal-Medium.ttf"
          get "ofl/tajawal/Tajawal-Bold.ttf"
          get "ofl/almarai/Almarai-Regular.ttf"
          get "ofl/almarai/Almarai-Bold.ttf"
          get "ofl/reemkufi/ReemKufi[wght].ttf"
          get "ofl/arefruqaa/ArefRuqaa-Regular.ttf"
          get "ofl/arefruqaa/ArefRuqaa-Bold.ttf"
          get "ofl/elmessiri/ElMessiri[wght].ttf"
          get "ofl/changa/Changa[wght].ttf"
          get "ofl/harmattan/Harmattan-Regular.ttf"
          get "ofl/harmattan/Harmattan-Bold.ttf"
          get "ofl/mirza/Mirza-Regular.ttf"
          get "ofl/mirza/Mirza-Bold.ttf"
          get "ofl/gulzar/Gulzar-Regular.ttf"
          get "ofl/arimo/Arimo[wght].ttf"
          get "ofl/inter/Inter[opsz,wght].ttf"
          get "ofl/roboto/Roboto[wdth,wght].ttf"
          get "ofl/opensans/OpenSans[wdth,wght].ttf"
          get "ofl/lato/Lato-Regular.ttf"
          get "ofl/lato/Lato-Bold.ttf"
          get "ofl/montserrat/Montserrat[wght].ttf"
          get "ofl/poppins/Poppins-Regular.ttf"
          get "ofl/poppins/Poppins-Medium.ttf"
          get "ofl/poppins/Poppins-Bold.ttf"
          get "ofl/raleway/Raleway[wght].ttf"
          get "ofl/nunito/Nunito[wght].ttf"
          get "ofl/oswald/Oswald[wght].ttf"
          get "ofl/bebasneue/BebasNeue-Regular.ttf"
          get "ofl/anton/Anton-Regular.ttf"
          get "ofl/playfairdisplay/PlayfairDisplay[wght].ttf"
          get "ofl/merriweather/Merriweather[opsz,wdth,wght].ttf"
          get "ofl/sourcesans3/SourceSans3[wght].ttf"
          get "ofl/worksans/WorkSans[wght].ttf"
          get "ofl/dmsans/DMSans[opsz,wght].ttf"
          get "ofl/manrope/Manrope[wght].ttf"
          get "ofl/spacegrotesk/SpaceGrotesk[wght].ttf"
          echo "=== Ringkasan font ==="
          ls -la app/src/main/assets/fonts

      - name: Pasang Gradle 8.11.1 dan cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK debug
        run: gradle assembleDebug --stacktrace

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleEditor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
